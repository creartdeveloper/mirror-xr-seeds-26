<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirror XR Admin</title>

<style>
    *{
        padding: 0;
        margin:0; 
        box-sizing: border-box;
    }

    html, body {
        min-height: 100%;
        width: 100%;
        overflow-x: hidden;
    }

    body {
        font-family: "Poppins", sans-serif;
        background:url("./poll/assets/background/Mirror-XR-OBS.png");
        background-size: cover;
        margin: 0;
        color: white;   

    }
    .logo{
        height: 40px;
    }

    button{
        padding: 8px 16px;
        border-radius: 8px; 
        border: none; 
        font-weight: 600; 
        cursor: pointer; 
        background: rgba(255, 255, 255, 0.1);
        color: white; 
        transition: 0.2s ease;
    }
    button:hover{
        background: rgba(255, 255, 255, 0.2);
    }

    /*admin layout*/
    #adminControls{
        display:flex; 
        flex-direction: column; 
        gap: 20px; 
        padding: 20px 30px; 
    }

    .admin-topbar{
        display: flex;
        justify-content: space-between;
        align-items: center; 
        flex-wrap: wrap;

    }

    .show-controls {
        display: flex;
        gap: 10px; 
        align-items: center; 
        flex-wrap: wrap;
    }

    .show-controls input{
        padding: 8px; 
        border-radius: 6px; 
        border: none;
    }

    /*program navigation*/
    .program-nav {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 30px;
        padding: 10px 40px;
        margin-top: 15px;
        position: relative; 
        z-index:1000;
    }

    .program-menu {
        list-style: none;
        display: flex;
        align-items: center;
        gap: 30px;
    }

    .program-menu li {
        position: relative;
    }

    .program-menu a {
        text-decoration: none;
        color: white;
        font-weight: 600;
        font-size: 15px;
        padding: 8px 18px;
        border-radius: 8px;
        background: rgba(0,0,0,0.35);
        backdrop-filter: blur(10px);
        transition: 0.2s ease;
    }

    .program-menu a:hover {
        background: rgba(255,255,255,0.15);
    }
    .dropdown-content {
        display: none;
        position: absolute;
        top: 110%;
        left: 0;

        min-width: 240px; 
        padding: 14 px 0;

        background: rgba(0,0,0,0.85);
        backdrop-filter: blur(14px);

        border-radius: 14px;

        box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        z-index: 5000; 
    }

    .dropdown-content li {
        list-style: none;
    }
    .dropdown-content button {
        width: 100%;
        padding: 10px 16px;
        background: none;
        border: none;
        color: white;
        text-align: left;
        font-size: 14px;
        cursor: pointer;
    }

    .dropdown-content button,
    .dropdown-content a {
        width: 100%;
        padding: 12px 16px;
        background: none;
        border: none;
        color: white;
        text-align: left;
        cursor: pointer;
        font-size: 14px;
    }
    .dropdown-content button:hover,
    .dropdown-content a:hover {
        background: rgba(255,255,255,0.1);
    }

    .dropdown:hover .dropdown-content {
        display: block;
    }

    .dropdown-content hr {
        border: none;
        border-top: 1px solid rgba(255,255,255,0.1);
        margin: 8px 0;
    }

    .dropdown:hover .dropdown-content {
        display: block;
    }
    .seed-session-button.is-active {
        background: #b8f7da;
        color: #111;
    }

    #seedSessionStatus {
        display: block;
        padding: 8px 16px 12px;
        font-size: 13px;
        color: #b8f7da;
        white-space: normal;
    }

    /*action rows*/

    .admin-row{
        display:flex; 
        justify-content: center; 
        gap: 15px; 
        flex-wrap: wrap;
    }

    /*poll display*/

    #main-container {
        max-width: 900px; 
        margin: 60px auto; 
        text-align: center; 
    }

    .poll-container h2 {
        font-size: 52px; 
        margin-bottom: 40px;
    }

    .option-row{
        position: relative; 
        overflow: hidden; 
        padding: 22px 30px; 
        border-radius: 20px; 
        margin-bottom: 25px; 
        /* background: rgba(255, 255, 255, 0.8); */
        backdrop-filter: blur(6px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        transition: transform 0.2s ease;
    }

    .option-row:hover{
        transform: scale(1.02);
    }

    .bar-fill{
        position: absolute; 
        left: 0; 
        top: 0;
        height: 100%; 
        width: 0%; 
        border-radius: 20px; 
        background: linear-gradient(
            90deg,
            rgba(255, 0, 200, 0.6),
            rgba(0, 200, 255, 0.6)
        );

        box-shadow: 0 0 20px rgba(255, 0, 200, 0.5);
        transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .option-content {
        position: relative;
        z-index: 2; 
        display: flex; 
        align-items:center; 
        justify-content: space-between;
    }

    .item-img {
        width: 60px; 
        height: 60px; 
        object-fit: contain;
    }

    .vote-count {
        font-size: 34px; 
        font-weight: bold; 
    }

    /*projection mode*/
    body.projection-mode #adminControls {
        display: none;
    }

    body.projection-mode .vote-count {
        display: none;
    }

    body.projection-mode {
        background: #000;
    }

    body.projection-mode #main-container {
        max-width: 1200px;
        margin: 80px auto;
    }

    body.projection-mode h2 {
        font-size: 72px;
    }

    body.projection-mode .option-row {
        background: rgba(0,0,0,0.6);
        border: 2px solid white;
    }

    body.projection-mode .bar-fill {
        background: linear-gradient(90deg, #00ff88, #00ccff);
    }

    /*exit button*/
    .exit-btn {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 10px 20px;
        font-size: 18px;
        z-index: 9999;
        }

        body:not(.projection-mode) .exit-btn {
            display: none;
        }

</style>
</head>

                                            <li><button id="goToPoll">Go To Poll</button></li>

                                            <li><hr></li>

                                            <li><button id="backToP1">Back To P1</button></li>
                                            <li><button id="backToP2">Back To P2</button></li>

                                            <li><button id="backToChat">Back To Chat</button></li>

                                            <li><hr></li>

                                            <li><button id="advanceStory">Advance Story</button></li>
                                            <li><button id="openFringeBtn">Open Fringe 2026</button></li>

                                        </ul>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
