<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirror XR Greenscreen</title>

<style>

/* ===== GREENSREEN BACKGROUND ===== */
body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    background: #00ff00; /* Pure chroma green */
    background-size: cover;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* ===== CONTAINER ===== */
.users-container {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 80px;
}

/* ===== USER CARD ===== */
.user-card {
    width: 180px;
    text-align: center;
    animation: popIn 0.6s ease forwards;
    transform: scale(0);
    opacity: 0;
}

/* ===== AVATAR CIRCLE ===== */
.user-avatar-wrapper {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
}

/* ===== AVATAR IMAGE ===== */
.user-avatar-wrapper img {
    width: 120px;
    height: 120px;
    object-fit: contain;
}

/* ===== USERNAME ===== */
.user-card p {
    margin-top: 18px;
    font-size: 28px;
    font-weight: bold;
    color: black;
}

/* ===== ANIMATION ===== */
@keyframes popIn {
    0% {
        transform: scale(0);
        opacity: 0;
    }
    70% {
        transform: scale(1.2);
        opacity: 1;
    }
    100% {
        transform: scale(1);
    }
}

</style>
</head>

<body>

<div id="usersContainer" class="users-container"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
import { 
  getFirestore, 
  collection, 
  query, 
  orderBy, 
  onSnapshot 
} from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";

/* ===== FIREBASE CONFIG ===== */
const firebaseConfig = {
  apiKey: "AIzaSyDiCIatzcDsnHdX_t-m15S1a8pNlrB2egs",
  authDomain: "mira-7360b.firebaseapp.com",
  projectId: "mira-7360b",
  storageBucket: "mira-7360b.appspot.com",
  messagingSenderId: "76074103771",
  appId: "1:76074103771:web:1a2d4ca7e8b5df27a82dfe"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ===== GET SHOW ID FROM URL ===== */
const showId = sessionStorage.getItem("showId");

if (!showId) {
  console.error("No showId in sessionStorage");
}

/* ===== FIRESTORE LISTENER ===== */
const container = document.getElementById("usersContainer");

const q = query(
  collection(db, "mirror-xr-seeds", showId, "users"),
  orderBy("timestamp", "asc")
);

onSnapshot(q, (snapshot) => {

  snapshot.docChanges().forEach((change) => {

    if (change.type === "added") {

      const data = change.doc.data();
      const docId = change.doc.id;

      // Prevent duplicates
      if (container.querySelector(`[data-id="${docId}"]`)) return;

      const card = document.createElement("div");
      card.className = "user-card";
      card.dataset.id = docId;

      card.innerHTML = `
        <div class="user-avatar-wrapper" style="background:${data.avatarBgColor || '#ffffff'}">
          <img src="${data.avatar}" />
        </div>
        <p>${data.username}</p>
      `;

      container.appendChild(card);
      setTimeout(() => {
        card.remove();
      }, 20000);
    }

  });

});
</script>

</body>
</html>
