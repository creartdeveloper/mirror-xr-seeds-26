<!DOCTYPE html>

<title>Mirror XR Admin</title>

<style>
    *{
    padding: 0;
    margin:0; 
    box-sizing: border-box;
    }

    html, body {
    min-height: 100%;
    width: 100%;
    overflow-x: hidden;
    }

    .logo {will-change: ;
        width: auto;
        height: 40px;
    }

    body {
        font-family: "Poppins", sans-serif;
        background:url("./poll/assets/background/chat-bg.jpg");
        margin: 0;
        color: white;
    }


    #adminControls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 30px;
        color: white;
    }

    .admin-showid {
        display: flex;
        gap: 10px;
    }

    .admin-showid input {
        padding: 8px;
        border-radius: 6px;
        border: none;
    }

    button {
        padding: 8px 16px;
        border-radius: 8px;
        border: none;
        font-weight: 600;
        cursor: pointer;
        background: transparent;
        color: white;
    }

    button:hover {
        opacity: 0.85;
    }


    #main-container {
        max-width: 900px;
        margin: 60px auto;
        text-align: center;
    }

    .poll-container {
        display: block;
    }
    .poll-container.active {
        display: block;
    }
    .poll-container h2 {
        font-size: 52px;
        margin-bottom: 50px;
    }


    .option-row {
        position: relative;
        overflow: hidden;
        padding: 28px 40px;
        border-radius: 16px;
        font:#fff;
        /* background: #fff; */
        /* border:purple; */
        border-radius: 16px;
        margin-bottom: 25px;
        
    }


    .option-row > * {
        position: relative;
        z-index: 2;

    }
    .bar-fill {
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        width: 0%;
        border: purple;
        border-radius: 16px;
        transition: width 0.4s ease;
        z-index: 0;
    }
    .item-left {
        display: flex;
        align-items: center;
        gap: 20px;
        font-size: 28px;
        font-weight: 600;
    }

    .item-img {
        width: 60px;
        height: 60px;
        object-fit: contain;
    }

    .vote-count {
        font-size: 34px;
        font-weight: bold;
    }

    body.projection-mode #adminControls {
        display: none;
    }

    body.projection-mode .vote-count {
        display: none;
    }

    body.projection-mode {
        background: #04f404;
    }

    body.projection-mode #main-container {
        max-width: 1200px;
        margin: 80px auto;
    }

    body.projection-mode h2 {
        font-size: 72px;
    }

    body.projection-mode .option-row {
        padding: 40px 60px;
        background: #04f404;
        border: 3px solid white;
        border-radius: 16px;
        background:#04f404;
    }

    .exit-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 10px 20px;
    font-size: 18px;
    z-index: 9999;
    }
    .exit-projection-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 12px 20px;
    font-size: 16px;
    z-index: 9999;
    background: #04f404;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    }

    /*when in admin mde*/
    body:not(.projection-mode) .exit-btn {
    display: none;
    }
    .subnav {
        position: relative;
        display: inline-block;
    }
    .subnav-content{
        display: none;
        position: absolute;
        left: 0;
        top: 100%;
        background-color:#FFB6C1 ;
        width: 200px;
        z-index: 10;
    }

    .subnav:hover .subnav-content {
        display: block;
    }


</style>
</head>
