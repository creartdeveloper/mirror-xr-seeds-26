<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirror XR Admin</title>

<style>
    body {
        font-family: "Poppins", sans-serif;
        background: #04f404;
        margin: 0;
        color: #111;
    }


    #adminControls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 30px;
        background: #04f404;
        color: white;
    }

    .admin-showid {
        display: flex;
        gap: 10px;
    }

    .admin-showid input {
        padding: 8px;
        border-radius: 6px;
        border: none;
    }

    button {
        padding: 8px 16px;
        border-radius: 8px;
        border: none;
        font-weight: 600;
        cursor: pointer;
        background: #04f404;
        color: white;
    }

    button:hover {
        opacity: 0.85;
    }


    #main-container {
        max-width: 900px;
        margin: 60px auto;
        text-align: center;
    }

    .poll-container {
        display: block;
    }
    .poll-container.active {
        display: block;
    }
    .poll-container h2 {
        font-size: 52px;
        margin-bottom: 50px;
    }


    .option-row {
        position: relative;
        overflow: hidden;
        padding: 28px 40px;
        border-radius: 16px;
        background: #04f404;
        /* border:#111;
        border-radius: 16px; */
        margin-bottom: 25px;
        
    }


    .option-row > * {
        position: relative;
        z-index: 2;

    }
    .bar-fill {
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #22c55e, #16a34a);
        border-radius: 16px;
        transition: width 0.4s ease;
        z-index: 0;
    }
    .item-left {
        display: flex;
        align-items: center;
        gap: 20px;
        font-size: 28px;
        font-weight: 600;
    }

    .item-img {
        width: 60px;
        height: 60px;
        object-fit: contain;
    }

    .vote-count {
        font-size: 34px;
        font-weight: bold;
    }

    body.projection-mode #adminControls {
        display: none;
    }

    body.projection-mode .vote-count {
        display: none;
    }

    body.projection-mode {
        background: #04f404;
    }

    body.projection-mode #main-container {
        max-width: 1200px;
        margin: 80px auto;
    }

    body.projection-mode h2 {
        font-size: 72px;
    }

    body.projection-mode .option-row {
        padding: 40px 60px;
        background: #04f404;
        border: 3px solid white;
        border-radius: 16px;
        background:#04f404;
    }

    .exit-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 10px 20px;
    font-size: 18px;
    z-index: 9999;
    }
    .exit-projection-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 12px 20px;
    font-size: 16px;
    z-index: 9999;
    background: #04f404;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    }

    /*when in admin mde*/
    body:not(.projection-mode) .exit-btn {
    display: none;
    }
        
</style>
</head>

<body>
<button id="exitBtn" class="exit-btn">Exit Projection</button>
    <div id="adminControls">
        <div class="admin-showid">
            <input type="number" id="audienceSizeInput" placeholder="Audience Size" min="1" style="width:120px;">
            <input type="text" id="adminShowIdInput" placeholder="Enter Show ID">
            <button id="loadShow">Load Show</button>
            <button id="resetShow">Reset Show</button>
            <button id="goToUserId">User Setup</button>
            <button id="startChat">Start Chat</button>

            <button id="backToP1">back To P1</button>
            <button id="backToP2">back To P2</button>
            <button id="backToP3">back To P3</button>
