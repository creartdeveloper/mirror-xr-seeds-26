<!--- landing page / main page-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Delius&family=Pacifico&display=swap" rel="stylesheet">
    <!-- <link rel="stylesheet" href="./style.css"> -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/classic.min.css"/>

    <!-- icon library -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>

        :root { /*avoid scrolling */
            --nav-height: 72px;
        }

        *{
            padding: 0;
            margin:0; 
            box-sizing: border-box;
        }
        html, body {
            min-height: 100%;
            width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: "Poppins", sans-serif;
            background-image: url("./poll/assets/background/Mirror-XR-OBS.png");
            /* background-image: url("./poll/assets/background/chat-bg.jpg"); */
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
            overscroll-behavior: none;
        }
        /*navgiation*/

        nav{
        position: fixed;
        top: 0;
        left: 0;
        height: var(--nav-height);
        width: 100%;
        z-index: 10;
        }

        .nav-header{
            padding:1rem;
            width:100%; 
            display:flex;
            align-items: center; 
            justify-content: space-between; 
        }

        .nav-links{
            display: flex;
            gap:1.5rem;
            list-style:none;
        }

        .nav-links a{
            color:white;
            font-weight: 500;
            text-decoration: none; 
            opacity:0.85;
            transition: opacity 0.2s ease; 
        }

        .nav-links a:hover{
            opacity:1;
        }

        .logo {
            width: auto;
            height: 40px;
        }

        .app-shell {
            min-height: 100vh;
            padding-top: var(--nav-height);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 0;
        }
        .app-content {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /*hero section*/

        .hero {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .hero::before {
            content: "";
            position: absolute;
            width: clamp(250px, 60vw, 400px);
            height: clamp(250px, 60vw, 400px);
            background: radial-gradient(circle, rgba(255,255,255,0.25), transparent);
            filter: blur(80px);
            z-index: -1;
        }

        /* Mira wrapper anchors everything */
        .mira-wrapper {
            position: absolute;
            bottom: 39%;   /*dont change this*/ 
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
        }
        .mira {
            width: clamp(260px, 22vw, 420px);
            display: block;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }

        .landing-subtext {
            margin-top: 1rem;
            color: white;
            opacity: 0.85;
            font-size: 1rem;
            justify-content: center;
        }
        .chat-bubble {
            position: absolute;
            top: -8%;
            left: -22%;
            width: clamp(95px, 8vw, 150px);
            transform: rotate(-4deg);
            animation: gentleFloat 4s ease-in-out infinite;
        }


        @keyframes gentleFloat {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }


        /*show-id-wrapper*/
        .show-id-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .show-id {
            display: flex;
            gap: 18px;
            justify-content: center;
        }

        .show-id input {
            width: clamp(45px, 4.5vw, 65px);
            height: clamp(45px, 4.5vw, 65px);
            font-size: clamp(1rem, 1.8vw, 1.5rem);
            font-size: clamp(1.2rem, 2vw, 2rem);
            border-radius: 14px;
            border: none;
            background: rgba(255,255,255,0.2);
            color: white;
            text-align: center;
            font-weight: bold;
        }
        .enter-btn {
            padding: 0.8rem 2rem;
            border-radius: 999px;
            border: none;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg,#9dff7a,#2bbf1e);
            color: white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: transform 0.2s ease;
        }

        .enter-btn:hover {
            transform: scale(1.05);
        }

        .show-id input:focus {
            outline: none;
            transform: scale(1.1);
            box-shadow: 0 0 12px #9dff7a;
        }
        /*buttons*/

        .sign-in {
            padding: 0.6rem 1.8rem;
            border-radius: 999px;
            border: none;
            background: white;
            color: #333;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .sign-in:hover{
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.2);
        }

        .submit-button {
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 14px;
            font-size: clamp(1rem, 2vw, 1.4rem);
            color: white;
            background: linear-gradient(
                to bottom,
                #9dff7a 0%,
                #4fd93a 45%,
                #2bbf1e 100%
        );
        box-shadow:
            inset 0 2px 0 rgba(255,255,255,0.45),
            inset 0 -2px 0 rgba(0,0,0,0.25),
            0 6px 14px rgba(0,0,0,0.25);
        }
        .page-text {
            position: absolute;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: clamp(240px, 28vw, 520px);
            z-index: 3;
        }


        .pin-section {
            position: absolute;
            bottom: 26%;
            left: 50%;
            transform: translateX(-50%);
            width: clamp(260px, 32vw, 650px);
            text-align: center;
            z-index: 4;
        }

        .pin-box-bg {
            width: 100%;
            display: block;
        }

        /*responsiveness benchmarks*/
        @media (min-width: 1920px) { /*projector*/
            .app-content {
                max-width: 560px;
            }

            .mira {
                width: 320px;
            }
        }

        @media (max-width: 1440px) { /*desktop*/
            .app-content {
                max-width: 520px;
            }

            .mira {
                width: 300px;
            }
        }


        @media (max-width: 1280px) { /*laptop*/
            .app-content {
                max-width: 480px;
            }

            .mira {
                width: 360px;
            }
        }

        @media (max-width: 969px) { /*tablet/small laptop*/
            .app-content {
                max-width: 420px;
            }

            .mira {
                width: 240px;
            }

            .show-id input {
                max-width: 60px;
            }
        }


        @media (max-width: 320px) { /*phones*/
            .app-content {
                padding: 1rem 0.8rem;
            }

            .show-id {
                gap: 8px;
            }

            .show-id input {
                max-width: 50px;
            }

            .mira {
                width: 180px;
            }
        }   
    </style>
    <title>Mirror App</title>

</head>
