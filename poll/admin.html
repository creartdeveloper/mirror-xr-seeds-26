<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
        body {
            font-family: "Poppins", sans-serif;
            background-size: cover;
            background-position: center bottom;
            background-color: #0deb35;;
            background-repeat: no-repeat;
            overscroll-behavior: none;
        }
        #main-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 900px;
            margin: 40px auto;
            align-items: center;
        }

        .admin-showid {
            margin: 20px;
        }

        .poll-container {
            display: none;
        }

        .poll-container.active {
            display: block;
        }

        .poll-container h2 {
            margin-bottom: 15px;
        }

        .poll-container > div {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            font-size: 20px;
            color: BLACK;
            border-radius: 8px;
        }

        #nextPoll, #backPoll {
            margin-top: 25px;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.25s ease;
            width: 200px;
        }

        .option-row {
            display: grid;
            grid-template-columns: 80px 1fr; /* avatar | text */
            align-items: center;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .avatar {
            display: block;
            margin: 0.6rem auto 0.4rem; 
            max-width: 200px; 
            width: 80%; 
            height:auto;
            opacity: 0.9;
        }
        .nav-buttons {
            display: flex;
            gap: 20px;
            margin-top: 40px;
        }
</style>
</head>
<body>
    <div class="admin-showid">
        <input type="text" id="adminShowIdInput" placeholder="Enter Show ID">
        <button id="loadShow">Load Show</button>
        <button id="resetShow">Reset This Show</button>
    </div>
    <div id="main-container">
        <div class="poll-container" data-level="p1">
            <h2>Poll 1</h2>
            <div class="result-bar1" data-option="a">
                <div class="option-row">
                    <img src="./assets/P1/A.png"  class="avatar">
                    <div class="option-text">
                        Option A
                        <span id="count-p1-a">0</span>
                    </div>
                </div>
            </div>
            <div id="result-bar2" data-option="b">
                <div class="option-row">
                    <img src="./assets/P1/B.png"  class="avatar">
                    <div class="option-text">
                        Option B
                        <span id="count-p1-b">0</span>
                    </div>
                </div>
            </div>
            <div id="result-bar3" data-option="c">
                <div class="option-row">
                    <img src="./assets/P1/C.png"  class="avatar">
                    <div class="option-text">
                        Option C
                        <span id="count-p1-c">0</span>
                    </div>
                </div>
            </div>
            <div id="result-bar4" data-option="d">
                <div class="option-row">
                    <img src="./assets/P1/D.png"  class="avatar">
                    <div class="option-text">
                        Option D
                        <span id="count-p1-d">0</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="poll-container" data-level="p2">
            <h2>Poll 2</h2>
            <div class="result-bar1" data-option="a">
                Option A
                <span id="count-p2-a">0</span>
            </div>
            <div id="result-bar2" data-option="b">
                Option B
                <span id="count-p2-b">0</span>
            </div>
            <div id="result-bar3" data-option="c">
                Option C
                <span id="count-p2-c">0</span>
            </div>
            <div id="result-bar4" data-option="d">
                Option D
                <span id="count-p2-d">0</span>
            </div>
        </div>

        <div class="poll-container" data-level="p3">
            <h2> Poll 3</h2>
            <div class="result-bar1" data-option="a">
                Option A
                <span id="count-p3-a">0</span>
            </div>
            <div id="result-bar2" data-option="b">
                Option B
                <span id="count-p3-b">0</span>
            </div>
            <div id="result-bar3" data-option="c">
                Option C
                <span id="count-p3-c">0</span>
            </div>
            <div id="result-bar4" data-option="d">
                Option D
                <span id="count-p3-d">0</span>
            </div>
        </div>

        <div class="poll-container" data-level="p4">
            <h2>Poll 4</h2>
            <div class="result-bar1" data-option="a">
                Option A
                <span id="count-p4-a">0</span>
            </div>
            <div id="result-bar2" data-option="b">
                Option B
                <span id="count-p4-b">0</span>
            </div>
            <div id="result-bar3" data-option="c">
                Option C
                <span id="count-p4-c">0</span>
            </div>
            <div id="result-bar4" data-option="d">
                Option D
                <span id="count-p4-d">0</span>
            </div>
        </div>
        <div class="nav-buttons">
            <button id="backPoll">Back</button>
            <button id="nextPoll">Next</button>
        </div>       
    </div>
    <script type="module" src="./count.js"></script>
</body>
</html>
