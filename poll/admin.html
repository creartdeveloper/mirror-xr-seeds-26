<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
        body {
            font-family: "Poppins", sans-serif;
            background-image: url("../poll/assets/background/chat-bg.jpg");
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
            overscroll-behavior: none;
        }
        #main-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 900px;
            margin: 40px auto;
        }

        .admin-showid {
            margin: 20px;
        }

        .poll-container {
            display: none;
        }

        .poll-container.active {
            display: block;
        }

        .poll-container h2 {
            margin-bottom: 15px;
        }

        .poll-container > div {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            font-size: 20px;
            color: white;
            border-radius: 8px;
        }

        .result-bar1 { background: #8d3434; }
        #result-bar2 { background: #0deb35; }
        #result-bar3 { background: #efe00a; }
        #result-bar4 { background: #f107de; }

        #nextPoll {
            margin-top: 30px;
            padding: 10px 20px;
        }
</style>
</head>
<body>
    <div class="admin-showid">
        <input type="text" id="adminShowIdInput" placeholder="Enter Show ID">
        <button id="loadShow">Load Show</button>
        <button id="resetShow">Reset This Show</button>
    </div>
    <div id="main-container">
        <div class="poll-container" data-level="p1">
            <h2>Poll 1</h2>
            <div class="result-bar1" data-option="a">
                Option A
                <span id="count-p1-a">0</span>
            </div>
            <div id="result-bar2" data-option="b">
                Option B
                <span id="count-p1-b">0</span>
            </div>
            <div id="result-bar3" data-option="c">
                Option C
                <span id="count-p1-c">0</span>
            </div>
            <div id="result-bar4" data-option="d">
                Option D
                <span id="count-p1-d">0</span>
            </div>
        </div>
        
        <div class="poll-container" data-level="p2">
            <h2>Poll 2</h2>
            <div class="result-bar1" data-option="a">
                Option A
                <span id="count-p2-a">0</span>
            </div>
            <div id="result-bar2" data-option="b">
                Option B
                <span id="count-p2-b">0</span>
            </div>
            <div id="result-bar3" data-option="c">
                Option C
                <span id="count-p2-c">0</span>
            </div>
            <div id="result-bar4" data-option="d">
                Option D
                <span id="count-p2-d">0</span>
            </div>
        </div>

        <div class="poll-container" data-level="p3">
            <h2> Poll 3</h2>
            <div class="result-bar1" data-option="a">
                Option A
                <span id="count-p3-a">0</span>
            </div>
            <div id="result-bar2" data-option="b">
                Option B
                <span id="count-p3-b">0</span>
            </div>
            <div id="result-bar3" data-option="c">
                Option C
                <span id="count-p3-c">0</span>
            </div>
            <div id="result-bar4" data-option="d">
                Option D
                <span id="count-p3-d">0</span>
            </div>
        </div>

        <div class="poll-container" data-level="p4">
            <h2>Poll 4</h2>
            <div class="result-bar1" data-option="a">
                Option A
                <span id="count-p4-a">0</span>
            </div>
            <div id="result-bar2" data-option="b">
                Option B
                <span id="count-p4-b">0</span>
            </div>
            <div id="result-bar3" data-option="c">
                Option C
                <span id="count-p4-c">0</span>
            </div>
            <div id="result-bar4" data-option="d">
                Option D
                <span id="count-p4-d">0</span>
            </div>
        </div>

        <button id="nextPoll">Next</button>
    </div>
    <script type="module" src="./count.js"></script>
</body>
</html>
