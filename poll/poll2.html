<!--- landing page / main page-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Delius&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="./poll.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/classic.min.css"/>



    <title>Mirror App</title>
</head>
<body>
    <nav class="nav-header">
        <div class="nav-logo">
            <img src="./assets/logo/logo.png"  alt="Mirror XR Logo" class="logo">
        </div>
        <ul class="nav-links" id="nav-links">
            <li><a href = "#">Home</a></li>
            <li><a href = "#">Score</a></li>
            <li><a href = "#">Gallery</a></li>
            <li><a href = "#">Contact</a></li>
        </ul>
    </nav>
    <main class="app-shell">
        <div class="app-content">
            <div class="message-box">
                <textarea maxlength="100" placeholder="Type message here" class="msg-text-box"></textarea>
            
                <div class="chat-avatar-wrapper">
                    <span id="chatUsername"></span>
                    <img id="chatAvatarImg" alt="selected avatar"/>
                </div>
            </div>
            <div class="emoji-container">
                <button class="emoji-button">😄</button>
                <button class="emoji-button">😭</button>
                <button class="emoji-button">☺️</button>
                <button class="emoji-button">😕</button>
                <button class="emoji-button">🥰</button>
            </div>
            <div class="poll" id="poll">
                <div class="poll-bars" id="pollOptions">
                    
                </div>
            </div>
