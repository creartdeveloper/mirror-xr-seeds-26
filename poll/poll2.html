<!--- landing page / main page-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Delius&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="./poll.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/classic.min.css"/>



    <title>Mirror App</title>
</head>
<body data-level="p2">
    <nav class="nav-header">
        <div class="nav-logo">
            <img src="./assets/logo/logo.png"  alt="Mirror XR Logo" class="logo">
        </div>
    </nav>
    <main class="app-shell">
        <div class="app-content">
            <div class="message-box">
                <textarea maxlength="100" placeholder="Type message here" class="msg-text-box"></textarea>
            
                <div class="chat-avatar">
                    <span id="chatUsername"></span>
                    <img id="chatAvatarImg" alt="selected avatar"/>
                </div>
            </div>
            <div class="emoji-container">
                <button class="emoji-button">😄</button>
                <button class="emoji-button">😭</button>
                <button class="emoji-button">☺️</button>
                <button class="emoji-button">😕</button>
                <button class="emoji-button">🥰</button>
            </div>
            <div class="grid">
                <div class="options-container">

                <div class="option-row" data-option="a">
                    <img src="./assets/P2/A1.png"  class="poll-avatar">
                    <div class="option-text">Option A</div>
                </div>

                <div class="option-row" data-option="b">
                    <img src="./assets/P2/B1.png"  class="poll-avatar">
                    <div class="option-text">Option B</div>
                </div>

                <div class="option-row" data-option="c">
                    <img src="./assets/P2/C1.png"  class="poll-avatar">
                    <div class="option-text">Option C</div>
                </div>

                <div class="option-row" data-option="d">
                    <img src="./assets/P2/D1.png"  class="poll-avatar">
                    <div class="option-text">Option D</div>
                </div>
            </div>
            <button class="next-button" id="nextButton" type="button">Next</button>
            <div class="footer">

            </div>
        </div>
    </main>
    <script type="module" src="./poll.js"></script>
</body>
</html>
