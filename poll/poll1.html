<!--- landing page / main page-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Delius&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="./poll.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/classic.min.css"/>



    <title>Mirror App</title>
</head>
<body data-level="p1">
    <nav class="nav-header">
        <div class="nav-logo">
            <img src="./assets/logo/logo.png"  alt="Mirror XR Logo" class="logo">
        </div>
    </nav>
    <main class="app-shell">
        <div class="app-content">
            <div class="message-box">
                <textarea maxlength="100" placeholder="Type message here" class="msg-text-box"></textarea>
            
                <div class="chat-avatar">
                    <span id="chatUsername"></span>
                    <img id="chatAvatarImg" alt="selected avatar"/>
                </div>
            </div>
            <div class="emoji-container">
                <button class="emoji-button">😄</button>
                <button class="emoji-button">😭</button>
                <button class="emoji-button">☺️</button>
                <button class="emoji-button">😕</button>
                <button class="emoji-button">🥰</button>
            </div>
            <div class="poll" id="poll">
                <div class="poll-bars">
                    <div class="option-row">
                        <button class="poll-item" data-option="a">
                            <img src="./assets/P1/A.png" alt="A">
                        </button>
                    </div>
                        <button class="poll-item" data-option="b">
                            <img src="./assets/P1/B.png" alt="B">
                        </button>
                        <button class="poll-item" data-option="c">
                            <img src="./assets/P1/C.png" alt="C">
                        </button>
                        <button class="poll-item" data-option="d">
                            <img src="./assets/P1/D.png" alt="D">
                        </button>
                </div>
            </div>
            <div class="pick-a-magical-item-bar">
                <img class="pick-a-magical-item-image" src="./assets/poll-components/Pick-a-Magical-Item.png" alt="pick-a-magical-item">
            </div>
            <button class="submit-button" id="submitButton" type="button">Submit</button>
            <div class="footer">

            </div>
        </div>
    </main>
    <script type="module" src="./poll.js"></script>
</body>
</html>
