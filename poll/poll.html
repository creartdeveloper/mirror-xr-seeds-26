<!--- landing page / main page-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Delius&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="./poll.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/classic.min.css"/>



    <title>Mirror App</title>
</head>
<body data-page="poll">
<!-- <body data-level="p1"> -->
    <nav class="nav-header">
        <div class="nav-logo">
            <img src="./assets/logo/logo.png"  alt="Mirror XR Logo" class="logo">
        </div>
    </nav>
    <main class="app-shell">
        <div class="app-content">
            <div class="message-box">
                <textarea maxlength="100" placeholder="Type message here" class="msg-text-box"></textarea>
            
                <div class="chat-avatar">
                    <span id="chatUsername"></span>
                    <img id="chatAvatarImg" alt="selected avatar"/>
                </div>
            </div>
            <div class="poll-container" data-level="p1">
                <div class="poll-bars">
                    <button class="poll-option" data-option="a">
                        <img src="./assets/P1/A.png" alt="A">
                    </button>
                    <button class="poll-option" data-option="b">
                        <img src="./assets/P1/B.png" alt="B">
                    </button>
                    <button class="poll-option" data-option="c">
                        <img src="./assets/P1/C.png" alt="C">
                    </button>
                    <button class="poll-option" data-option="d">
                        <img src="./assets/P1/D.png" alt="D">
                    </button>
                </div>   
                <div class="pick-a-magical-item-bar">
                    <img class="pick-a-magical-item-image" src="./assets/poll-components/Pick-a-Magical-Item.png" alt="pick-a-magical-item">
                </div>
            </div>
    
            <div class="poll-container" data-level="p2">
                <div class="options-container">

                    <div class="poll-option" data-option="a">
                    <img src="./assets/P2/A.png" class="poll-avatar">
                    <div class="option-text">Option A</div>
                    </div>

                    <div class="poll-option" data-option="b">
                    <div class="option-text">Option B</div>
                    </div>

                    <div class="poll-option" data-option="c">
                    <img src="./assets/P1/C.png" class="poll-avatar">
                    <div class="option-text">Option C</div>
                    </div>

                    <div class="poll-option" data-option="d">
                    <img src="./assets/P1/D.png" class="poll-avatar">
                    <div class="option-text">Option D</div>
                    </div>
                </div>
            </div>
            <div class="poll-container" data-level="p3">
                <div class="options-container">

                    <div class="poll-option" data-option="a">
                    <img src="./assets/P2/A.png" class="poll-avatar">
                    <div class="option-text">Option A</div>
                    </div>

                    <div class="poll-option" data-option="b">
                    <img src="./assets/P2/B.png" class="poll-avatar">
                    <div class="option-text">Option B</div>
                    </div>

                    <div class="poll-option" data-option="c">
                    <img src="./assets/P2/C.png" class="poll-avatar">
                    <div class="option-text">Option C</div>
                    </div>

                    <div class="poll-option" data-option="d">
                    <img src="./assets/P2/D.png" class="poll-avatar">
                    <div class="option-text">Option D</div>
                    </div>
                </div>
            </div>
            <div class="poll-container" data-level="p4">
                <div class="options-container">

                    <div class="poll-option" data-option="a">
                    <img src="./assets/P2/A.png" class="poll-avatar">
                    <div class="option-text">Option A</div>
                    </div>

                    <div class="poll-option" data-option="b">
                    <img src="./assets/P2/B.png" class="poll-avatar">
                    <div class="option-text">Option B</div>
                    </div>

                    <div class="poll-option" data-option="c">
                    <img src="./assets/P2/C.png" class="poll-avatar">
                    <div class="option-text">Option C</div>
                    </div>

                    <div class="poll-option" data-option="d">
                    <img src="./assets/P2/D.png" class="poll-avatar">
                    <div class="option-text">Option D</div>
                    </div>
                </div>
            </div>
            <div class="emoji-container">
                <button class="emoji-button">😄</button>
                <button class="emoji-button">😭</button>
                <button class="emoji-button">☺️</button>
                <button class="emoji-button">😕</button>
                <button class="emoji-button">🥰</button>
            </div>
            <div class="footer">

            </div>
        </div>
    </main>
</body>
<script type="module" src="./poll.js"></script>
<script type="module" src="./globalNavigation.js"></script>

</html>
